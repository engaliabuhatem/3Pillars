# 3 Pillars — nginx site config.
#
# __DOMAIN__ is replaced by setup-server.sh; certbot then adds the HTTPS lines.
#
#   __DOMAIN__ / www.__DOMAIN__   → Next.js  (127.0.0.1:3011)
#   admin.__DOMAIN__              → Django   (127.0.0.1:8011)
#                                    + /static/ and /assets/ straight from disk
#
# Ports differ from HS Investment's (3000/8001) so both sites can share a VPS.
# /var/lib/3pillars/private (CVs, attachments) has NO location: never public.

limit_req_zone $binary_remote_addr zone=pillars_forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pillars_login:10m rate=5r/m;

# ── Website (Next.js) ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Hashed build assets never change for a given URL.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The content webhook is for the backend on this machine only (both address forms).
    location ^~ /api/revalidate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3011;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── CMS + API (Django) ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.__DOMAIN__;

    # Hero videos (8 MB) and proposal attachments (5 × 10 MB).
    client_max_body_size 60M;

    location /static/ {
        alias /srv/3pillars/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Public uploads (images, PDFs, hero video). Never the private folder.
    location /assets/ {
        alias /var/lib/3pillars/assets/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    location = / {
        return 302 /admin/;
    }

    # A first line of defence; Django throttles too.
    location ~ ^/api/(enquiries|consultation-requests|applications|downloads/\d+/lead)/$ {
        limit_req zone=pillars_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/snippets/3pillars-proxy.conf;
    }

    location = /admin/login/ {
        limit_req zone=pillars_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/snippets/3pillars-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8011;
        include /etc/nginx/snippets/3pillars-proxy.conf;
    }
}
